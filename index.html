async function loadRates(){
 var target=db.settings.currency||"EUR";
 try{var r=await fetch("https://api.frankfurter.app/latest?from=EUR");if(!r.ok)throw new Error("rate");var d=await r.json();ratesCache={base:"EUR",rates:Object.assign({EUR:1},d.rates||{}),fetchedAt:Date.now()};return ratesCache}catch(e){return ratesCache;}
}
function convertFromEUR(amount,code){var rate=ratesCache.rates[code];return code==="EUR"?amount:(rate?amount*rate:null)}
function convertCurrency(amount,from,to){if(from===to)return amount;var fromRate=ratesCache.rates[from],toRate=ratesCache.rates[to];if(!fromRate||!toRate)return null;return amount/fromRate*toRate}
function aggregateSpent(spentBy){var total=0,missing=[];Object.keys(spentBy).forEach(function(c){var v=convertCurrency(spentBy[c],c,db.settings.currency);if(v==null)missing.push(c);else total+=v});return {total:total,missing:missing};}

function personKey(s){
 return String(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim();
}
function levenshtein(a,b){

 var m=a.length,n=b.length;
 if(!m)return n;if(!n)return m;

   cur[0]=i;
   for(j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
   var t=prev;prev=cur;cur=t;

 return prev[n];
}

function bestWorkGuess(title,subtitle,series){

 if(raw)return raw;
 var t=String(title||"").trim();

 var candidates=[];
 // Prefer explicit series wording in subtitles/titles.
 var m=sub.match(/(?:series|from the|a)\s*[:\-]?\s*([^:]+?)(?:\s+series)?$/i);if(m)candidates.push(m[1]);
 var a=t.split(/\s*:\s*/)[0].trim();
 a=a.replace(/\s*[-–—]\s*(?:volume|vol\.?|book|omnibus|edition).*$/i,"");
 a=a.replace(/\s+(?:volume|vol\.?|book)\s*\d+.*$/i,"");
 a=a.replace(/\s*#\s*\d+.*$/i,"");
 a=a.replace(/\s*\(?(?:omnibus|3[- ]in[- ]1|2[- ]in[- ]1|edition)\)?/ig,"").trim();
 if(a)candidates.push(a);

function reconcileWork(guess,showAlerts){

   var d=levenshtein(k,p.k),max=Math.max(k.length,p.k.length);
   return d<=2 || (max>=6&&d/max<=0.20) || p.k.indexOf(k)>=0 || k.indexOf(p.k)>=0;
 });
 if(similar.length){
   var candidate=similar[0].name;
   if(showAlerts){
     var useExisting=confirm("Possible duplicate work / series:\n\n“"+name+"”\n\nExisting work: “"+candidate+"”\n\nUse the existing work instead?");
     if(useExisting)return candidate;
   }

}

function reconcilePeople(names,role,showAlerts){

 (names||[]).forEach(function(raw){
   var name=String(raw||"").trim(); if(!name)return;
   var k=personKey(name);
   var exact=pool.find(function(p){return p.k===k});
   if(exact){out.push(exact.name);return;}
   var similar=pool.filter(function(p){
     if(!k||!p.k)return false;
     var d=levenshtein(k,p.k), max=Math.max(k.length,p.k.length);
     return d<=2 || (max>=6 && d/max<=0.20);
   });
   if(similar.length){
     var candidate=similar[0].name;
     if(showAlerts && !warned[k]){
       warned[k]=true;
       var useExisting=confirm("Possible duplicate "+role+":\n\n“"+name+"”\n\nExisting name: “"+candidate+"”\n\nUse the existing name instead?");
       if(useExisting){out.push(candidate);return;}

   var body='978'+s, sum=0;
   for(var j=0;j<12;j++) sum+=parseInt(body[j],10)*(j%2?3:1);

}

   var exact=items.find(function(x){return normalizeISBN(x.isbn||'')===clean});
   var item=exact||items[0];
   if(item&&item.title){
    var obj={title:item.title,subtitle:'',authors:item.authors||[],publisher:item.publisher||'',publishedDate:item.publishedDate||'',language:'pt',imageLinks:item.cover?{large:item.cover}:{}};
    applyBasic(obj,'Brazil web');
    if(item.isbn)set('fisbn',normalizeISBN(item.isbn));
    if(item.cover){set('fcoverUrl',item.cover);var cp=document.getElementById('coverPreview');if(cp){cp.src=item.cover;cp.style.display='block'}}
    return item;
   }
  }catch(e){}
  return null;
 }
 async function gcdLookup(){
   // Keep GCD enrichment short and non-blocking. A slow/changed GCD endpoint must never prevent ISBN metadata.
   var title=(document.getElementById('ftitle')||{}).value||'';if(!title)return false;
   try{
     var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},5000);
     var q=encodeURIComponent(title.replace(/\s*[:#-].*$/,''));
     var r=await fetch('https://www.comics.org/api/series/name/'+q+'/',{headers:{Accept:'application/json'},signal:controller.signal});clearTimeout(timer);if(!r.ok)return false;
     var d=await r.json(),results=d.results||d.series||[];if(!Array.isArray(results))return false;
     var best=results.slice(0,5);
     for(var i=0;i<best.length;i++){
       var id=best[i].id;if(!id)continue;
       try{var ir=await fetch('https://www.comics.org/api/series/'+id+'/',{headers:{Accept:'application/json'}});if(!ir.ok)continue;var x=await ir.json();
         var creators=x.creators||x.credits||x.creator_credits||[];var names=[];if(Array.isArray(creators))creators.forEach(function(c){if(c&&c.name)names.push(c.name)});if(names.length&&!document.getElementById('fwriters').value)set('fwriters',reconcilePeople(names,'writer',true).join(', '));
         return !!(names.length||x.publisher||x.name);
       }catch(e){}
     }
   }catch(e){}return false;
 }
 if(!isValidISBN13(clean)){setStatus('ISBN captured, but it is not a valid ISBN-13: '+clean,'Please check the barcode and try again.');return;}
 setStatus('ISBN '+clean+' captured. Looking up metadata…','Searching Google Books, Open Library and Brazilian comic/catalogue sources…');
 var google=null,ol=null,br=null,gcd=false;
 // Run independent sources concurrently. One failed source must not block the others.
 try{[google,ol,br]=await Promise.all([googleLookup(),openLibraryLookup(),brazilLookup()])}catch(e){}
 try{gcd=await gcdLookup()}catch(e){}
 var found=!!((document.getElementById('ftitle')||{}).value||google||ol||br);
 var cover=document.getElementById('fcoverUrl');
 if(found){
   var country=document.getElementById('feditionCountry'),currency=document.getElementById('fcurrency');if(country&&currency){var cc=currencyForCountry(country.value);if(cc)currency.value=cc}
   if(gcd)setStatus('✓ ISBN matched and enriched with comic metadata. Review before saving.','✓ Metadata found and enriched with comic-specific information.');
   else setStatus('✓ ISBN matched. Review the metadata before saving.','✓ Metadata found. Review before saving.');
 }else{
   setStatus('⚠ ISBN captured, but no metadata source returned a match. The ISBN is still in the form.','No online metadata match was found. You can complete the edition manually or search by title.');
 }
}
function stopScanner(){
  try{
    if(scanVideo&&scanVideo._zxingReader){
      try{scanVideo._zxingReader.reset();}catch(e){}
      scanVideo._zxingReader=null;
    }
  }catch(e){}
  if(scanStream){try{scanStream.getTracks().forEach(function(t){t.stop();});}catch(e){} scanStream=null;}
  if(scanVideo){try{scanVideo.pause();}catch(e){} scanVideo.srcObject=null;}
  if(scanner)scanner.classList.remove("open");
}
var zxingPromise=null;
function loadZXing(){
 if(zxingPromise)return zxingPromise;
 zxingPromise=new Promise(function(resolve,reject){
  if(window.ZXingBrowser){resolve(window.ZXingBrowser);return;}
  var sc=document.createElement("script");
  sc.src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js";
  sc.onload=function(){if(window.ZXingBrowser)resolve(window.ZXingBrowser);else reject(new Error("ZXing did not load"));};
  sc.onerror=function(){reject(new Error("ZXing failed to load"));};
  document.head.appendChild(sc);
 });
 return zxingPromise;
}
async function startBarcodeDetector(){
 try{
  var fm=await BarcodeDetector.getSupportedFormats();
  var use=fm.filter(function(x){return["ean_13","ean_8","upc_a","upc_e","code_128"].indexOf(x)>=0});
  var detector=new BarcodeDetector({formats:use.length?use:fm});
  scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  scanVideo.srcObject=scanStream;await scanVideo.play();scanStatus.textContent="Scanning…";
  async function loop(){
   if(!scanStream)return;
   try{
    var codes=await detector.detect(scanVideo);
    if(codes.length){var value=codes[0].rawValue||"";stopScanner();var normalized=normalizeISBN(value);var input=document.getElementById("fisbn");if(input)input.value=normalized;lookupISBN(normalized);return;}
   }catch(e){}
   requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);return true;
 }catch(e){
  if(scanStream)stopScanner();
  throw e;
 }
}
async function startZXing(){
 var ZX=await loadZXing();
 scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
 scanVideo.srcObject=scanStream;await scanVideo.play();scanStatus.textContent="Scanning…";
 var reader=new ZX.BrowserMultiFormatReader();
 reader.decodeFromVideoDevice(undefined,scanVideo,function(result,error){
  if(result){var value=result.getText?result.getText():result.text||"";if(!value)return;stopScanner();var normalized=normalizeISBN(value);if(normalized){var input=document.getElementById("fisbn");if(input)input.value=normalized;lookupISBN(normalized);}}
 });
 scanVideo._zxingReader=reader;
 return true;
}
async function startScanner(){
 scanner.classList.add("open");scanStatus.textContent="Starting camera…";
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanStatus.textContent="Camera unavailable. Enter the ISBN manually.";return}
 try{
  if("BarcodeDetector" in window){
   try{await startBarcodeDetector();return;}catch(e){}
  }
  scanStatus.textContent="Starting barcode scanner…";

 }catch(e){
  scanStatus.textContent="Barcode detection isn't available in this browser. Enter the ISBN manually.";
 }
}

function formatDate(v){if(!v)return "—";var p=String(v).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v}
function retryCover(img,isbn){
  if(!img || img.dataset.retrying) return;
  img.dataset.retrying="1";
  var key=String(isbn||"").replace(/[^0-9Xx]/g,"");
  if(!key){img.style.display="none";return;}
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+encodeURIComponent(key)).then(function(r){return r.ok?r.json():null}).then(function(d){
    var v=d&&d.items&&d.items[0]&&d.items[0].volumeInfo;
    var c=v&&v.imageLinks&&(v.imageLinks.extraLarge||v.imageLinks.large||v.imageLinks.medium||v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
    if(c){img.src=String(c).replace(/^http:\/\//,"https://");}
    else img.style.display="none";
  }).catch(function(){img.style.display="none";});
}
function dashCard(label,x,extra){
 if(!x)return '<article class="dashCard"><div class="dashLabel">'+esc(label)+'</div><div class="dashEmpty">'+esc(t("nothing"))+'</div></article>';
 var covers=coverWithFallback(x);
 var cover=covers.length?'<img src="'+esc(covers[0])+'" alt="Cover" data-isbn="'+esc(x.isbn)+'" data-covers="'+esc(JSON.stringify(covers))+'">':'<div class="dashCover"></div>';
 return '<article class="dashCard"><div class="dashLabel">'+esc(label)+'</div>'+
 '<div class="dashClickable" data-dash-detail="'+esc(x.id)+'">'+cover+'<div class="dashTitle">'+esc(x.title||x.work)+'</div></div>'+
 (extra?'<div class="dashDate">'+esc(extra)+'</div>':'')+'</article>';
}
function dashboardData(){
 var e=all();
 var reading=e.filter(function(x){return x.ownedQty>0&&x.readingStatus==="Reading"}).sort(function(a,b){return (b.readingStartedDate||"").localeCompare(a.readingStartedDate||"")});
 var lastRead=e.filter(function(x){return x.lastReadDate}).sort(function(a,b){return b.lastReadDate.localeCompare(a.lastReadDate)})[0];
 var lastPurchased=e.filter(function(x){return x.purchaseDate}).sort(function(a,b){return b.purchaseDate.localeCompare(a.purchaseDate)})[0];
 var today=todayISO();
 var next=e.filter(function(x){return x.wishlist&&x.releaseDate&&x.releaseDate>=today}).sort(function(a,b){return a.releaseDate.localeCompare(b.releaseDate)})[0];
 return {reading:reading[0]||null,lastRead:lastRead||null,lastPurchased:lastPurchased||null,next:next||null};
}
async function refreshWishlistReleases(){
 var items=all().filter(function(x){return x.wishlist&&!x.releaseDate});
 for(var i=0;i<items.length;i++){var x=items[i],q=x.isbn?"isbn:"+x.isbn:"intitle:"+(x.title||x.work);
  try{var r=await fetch("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=10");if(!r.ok)continue;
   var d=await r.json(),today=todayISO(),c=(d.items||[]).map(function(z){return z.volumeInfo||{}}).filter(function(v){return v.publishedDate&&/^\d{4}-\d{2}-\d{2}$/.test(v.publishedDate)&&v.publishedDate>=today});
   if(c.length){c.sort(function(a,b){return a.publishedDate.localeCompare(b.publishedDate)});x.releaseDate=c[0].publishedDate;x.releaseDateSource="Google Books";
    if(!x.coverUrl&&c[0].imageLinks)x.coverUrl=(c[0].imageLinks.extraLarge||c[0].imageLinks.large||c[0].imageLinks.medium||c[0].imageLinks.thumbnail||"").replace(/^http:\/\//,"https://");}
  }catch(e){}
 }
 save();renderDashboard();
}
async function resolveCoverForEdition(x){
  if(!x) return "";
  var existing=String(x.coverUrl||"");
  var isBrokenFixture=existing.indexOf("m.media-amazon.com/images/P/")>=0 || existing.indexOf("images-na.ssl-images-amazon.com/images/P/")>=0;
  if(existing && !isBrokenFixture) return existing;
  var isbn=String(x.isbn||"").replace(/[^0-9Xx]/g,"");
  if(!isbn) return "";
  try{
    var r=await fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+encodeURIComponent(isbn)+"&maxResults=5");
    if(r.ok){
      var d=await r.json();
      var item=d.items&&d.items[0];
      var v=item&&item.volumeInfo;
      if(item&&item.id){
        x.coverUrl="https://books.google.com/books/content?id="+encodeURIComponent(item.id)+"&printsec=frontcover&img=1&zoom=2&source=gbs_api";
        return x.coverUrl;
      }
      var c=v&&v.imageLinks&&(v.imageLinks.extraLarge||v.imageLinks.large||v.imageLinks.medium||v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
      if(c){x.coverUrl=String(c).replace(/^http:\/\//,"https://");return x.coverUrl;}
    }
  }catch(e){}
  return "";
}
async function ensureDashboardCovers(){
  var items=all().filter(function(x){return !x.coverUrl && x.isbn;});
  var changed=false;
  for(var i=0;i<items.length;i++){
    var before=items[i].coverUrl;
    await resolveCoverForEdition(items[i]);
    if(items[i].coverUrl!==before) changed=true;
  }
  if(changed){save();renderDashboard();}
}
function renderDashboard(){

 dashboard.innerHTML='<div class="dashboardHeader"><h2>On your shelf</h2><button id="refreshReleases">'+esc(t("refresh"))+'</button></div><div class="dashboardGrid">'+dashCard(t("current"),d.reading,d.reading&&("Started "+formatDate(d.reading.readingStartedDate)))+dashCard(t("lastRead"),d.lastRead,d.lastRead&&("Read "+formatDate(d.lastRead.lastReadDate)))+dashCard(t("lastPurchased"),d.lastPurchased,d.lastPurchased&&("Purchased "+formatDate(d.lastPurchased.purchaseDate)))+dashCard(t("nextRelease"),d.next,d.next&&("Release "+formatDate(d.next.releaseDate)))+'</div>';
 var coverImgs=dashboard.querySelectorAll('.dashCard img[data-isbn]');coverImgs.forEach(function(img){
  var candidates=[];try{candidates=JSON.parse(img.getAttribute('data-covers')||'[]')}catch(e){}
  var idx=0;img.onerror=function(){idx++;if(idx<candidates.length){img.src=candidates[idx];return;}
  var isbn=String(img.getAttribute("data-isbn")||"").replace(/[^0-9Xx]/g,"");
  if(isbn&&!img.dataset.googleTried){img.dataset.googleTried="1";fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+encodeURIComponent(isbn)+"&maxResults=5").then(function(r){return r.ok?r.json():null}).then(function(d){
    var v=d&&d.items&&d.items[0]&&d.items[0].volumeInfo;
    var c=v&&v.imageLinks&&(v.imageLinks.extraLarge||v.imageLinks.large||v.imageLinks.medium||v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
    if(c){img.src=String(c).replace(/^http:\/\//,"https://");}else{img.style.display="none";}
  }).catch(function(){img.style.display="none";});return;}
  img.style.display='none';};
});
 dashboard.querySelectorAll("[data-dash-detail]").forEach(function(el){el.onclick=function(){detail(el.getAttribute("data-dash-detail"))}});
 var b=document.getElementById("refreshReleases");if(b)b.onclick=refreshWishlistReleases;
}
function render(){
 try{
  renderNav();
  var isSettings=db.page==="settings";
  var isDashboard=db.page!=="collection"&&!isSettings;
  stats.style.display=isDashboard?"grid":"none";
